    <!-- TOP APPLICATION HEADER (Responsive Desktop & Mobile) -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 px-4 sm:px-6 lg:px-8 py-3.5 shadow-sm">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
        
        <!-- Left: Logo & Title -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center text-white font-extrabold shadow-md shadow-teal-500/20 shrink-0">
            <span id="app-logo" class="text-xl leading-none" role="img" aria-label="Sprout">🌱</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 id="app-title" class="font-extrabold text-slate-900 text-sm sm:text-base leading-tight tracking-tight">IPEKA Student Well Being Hub</h1>
              <span class="bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-200 hidden sm:inline-flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> <span data-i18n="app.safe_space">Safe Space</span>
              </span>
            </div>
            <p data-i18n="app.subtitle" class="text-[11px] text-slate-500 font-medium hidden md:block">Ruang Pendampingan Emosional & Kesejahteraan Siswa</p>
          </div>
        </div>

        <!-- Right: Admin Actions & User Profile -->
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Language Switcher (EN / ID) -->
          <div id="lang-switcher" class="inline-flex items-center rounded-xl border border-slate-200 bg-slate-100 p-0.5 text-[11px] font-extrabold shadow-xs">
            <button type="button" id="btn-lang-id" onclick="setLanguage('id')" class="px-2 py-1 rounded-lg transition bg-white text-teal-700 shadow-xs cursor-pointer">ID</button>
            <button type="button" id="btn-lang-en" onclick="setLanguage('en')" class="px-2 py-1 rounded-lg transition text-slate-500 hover:text-slate-800 cursor-pointer">EN</button>
          </div>

          <!-- Button Tambah Guru BK (Khusus ADMIN) -->
          <button id="btn-admin-add-counselor" onclick="openAdminCounselorModal()" class="hidden px-2.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-[11px] shadow-sm transition flex items-center gap-1" title="Tambah Guru BK (Khusus Admin)">
            <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
            <span data-i18n="nav.add_counselor" class="hidden sm:inline">+ Guru BK</span>
          </button>

          <!-- User Profile Badge -->
          <div class="flex items-center gap-2 p-1.5 rounded-2xl border border-slate-200/60 bg-white shadow-sm">
            <div id="user-avatar-badge" class="w-8 h-8 rounded-xl bg-teal-50 border border-teal-200 flex items-center justify-center text-teal-700 font-extrabold text-xs">
              SW
            </div>
            <div class="text-left hidden sm:block pr-1">
              <span id="app-user-name" class="font-bold text-xs text-slate-900 block leading-tight truncate max-w-[130px]">Pengguna</span>
              <span id="app-user-role-badge" class="text-[10px] text-teal-600 font-semibold block leading-tight">Siswa</span>
            </div>
            <!-- Tombol Beralih Akun Google Resmi (ALCOA Compliant) -->
            <button id="btn-logout-switch" onclick="switchGoogleAccount()" class="ml-1 text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-slate-100 transition" title="Beralih Akun Google Resmi">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

      </div>
    </header>
