    function t(key, params) {
      const lang = (typeof currentLang !== 'undefined' && currentLang === 'en') ? 'en' : 'id';
      let val = (I18N[lang] && I18N[lang][key]) || (I18N['id'] && I18N['id'][key]) || key;
      if (params && typeof params === 'object') {
        Object.keys(params).forEach(p => {
          val = val.replace(new RegExp(`{${p}}`, 'g'), params[p]);
        });
      }
      return val;
    }

    function setLanguage(lang) {
      currentLang = (lang === 'en') ? 'en' : 'id';
      try {
        localStorage.setItem('wellbeing_lang', currentLang);
      } catch (e) {}

      const btnId = document.getElementById('btn-lang-id');
      const btnEn = document.getElementById('btn-lang-en');
      if (btnId && btnEn) {
        if (currentLang === 'id') {
          btnId.className = 'px-2 py-1 rounded-lg transition bg-white text-teal-700 shadow-xs cursor-pointer';
          btnEn.className = 'px-2 py-1 rounded-lg transition text-slate-500 hover:text-slate-800 cursor-pointer';
        } else {
          btnEn.className = 'px-2 py-1 rounded-lg transition bg-white text-teal-700 shadow-xs cursor-pointer';
          btnId.className = 'px-2 py-1 rounded-lg transition text-slate-500 hover:text-slate-800 cursor-pointer';
        }
      }

      if (document.documentElement) {
        document.documentElement.lang = currentLang;
      }

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val) el.textContent = val;
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        const val = t(key);
        if (val) el.setAttribute('placeholder', val);
      });

      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.getAttribute('data-i18n-title');
        const val = t(key);
        if (val) el.setAttribute('title', val);
      });

      if (typeof updateUserUI === 'function') {
        updateUserUI();
      }

      if (typeof renderFeelingsWheelSelector === 'function') {
        renderFeelingsWheelSelector();
      }

      if (typeof updateSurveyBannerInfo === 'function') {
        updateSurveyBannerInfo();
      }
    }

    // Universal RPC Bridge: Mendukung Google Apps Script & Mock Server (Playwright E2E)
    function callServer(method, args) {
      return new Promise((resolve, reject) => {
        const callerEmail = currentUser ? currentUser.email : (SERVER_CONTEXT && SERVER_CONTEXT.activeEmail ? SERVER_CONTEXT.activeEmail : '');
        if (window.google && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)[method](...(args || []), callerEmail);
        } else {
          // Fallback ke server mock HTTP local
          fetch('/api/rpc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              method: method,
              args: args || [],
              sessionUser: currentUser || { email: callerEmail, role: 'STUDENT' }
            })
          })
          .then(async res => {
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Server error');
            resolve(json);
          })
          .catch(reject);
        }
      });
    }

    // Toast Helper
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // =========================================================================
    // IDENTITAS & AUTENTIKASI AKUN GOOGLE RESMI (ALCOA COMPLIANT)
    // =========================================================================
    function getCanonicalWebAppUrl() {
      if (SERVER_CONTEXT && SERVER_CONTEXT.webAppUrl && !SERVER_CONTEXT.webAppUrl.includes('googleusercontent.com')) {
        return SERVER_CONTEXT.webAppUrl;
      }
      return 'https://script.google.com/macros/s/AKfycbxomEGvXWt2rZPxuJviuPNgvlBsqQ9yAx3RMzQXI66Q3GkKhsvGOs1WCnl5kIps9P3rUw/exec';
    }

    function switchGoogleAccount() {
      const canonicalUrl = getCanonicalWebAppUrl();
      const currentEmail = (currentUser && currentUser.email) ? currentUser.email : 'Akun Google Aktif';
      const msg = `Akun Google saat ini: ${currentEmail}\n\nPerhatian: Google Apps Script Web App sering mengalami Error 400 Bad Request jika memilih akun dari pemilih multi-akun di browser yang sama.\n\nCara Resmi & Paling Aman:\n1. Buka tautan Web App di Profil Chrome terpisah atau Jendela Incognito dengan akun yang Anda tuju.\n2. Atau klik OK untuk logout dari seluruh akun Google Anda saat ini agar dapat login kembali.\n\nKlik OK untuk ke halaman Logout Google, atau Batal untuk menyalin tautan Web App.`;
      
      if (confirm(msg)) {
        localStorage.removeItem('wellbeing_user_session');
        if (window.top) {
          window.top.location.href = 'https://accounts.google.com/Logout';
        } else {
          window.location.href = 'https://accounts.google.com/Logout';
        }
      } else {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(canonicalUrl);
          showToast('Tautan Web App disalin! Buka di Profil Chrome / Incognito 📋', 'ℹ️');
        }
      }
    }

    function handleGoogleLoginClick(event) {
      if (event) event.preventDefault();
      const canonicalUrl = getCanonicalWebAppUrl();
      if (window.top) {
        window.top.location.href = canonicalUrl;
      } else {
        window.location.href = canonicalUrl;
      }
    }

    function openAdminCounselorModal() {
      if (!currentUser || currentUser.role !== 'ADMIN') {
        showToast('Hanya Admin yang berwenang menambahkan Guru BK!', '⚠️');
        return;
      }
      document.getElementById('admin-counselor-modal').classList.remove('hidden');
      setLanguage(currentLang);
      initIcons();
    }

    function closeAdminCounselorModal() {
      document.getElementById('admin-counselor-modal').classList.add('hidden');
    }

    async function handleAdminAddCounselor() {
      const email = document.getElementById('admin-new-counselor-email').value.trim();
      const name = document.getElementById('admin-new-counselor-name').value.trim();
      const title = document.getElementById('admin-new-counselor-title').value.trim() || 'Guru BK';

      if (!email || !name) {
        showToast('Email dan Nama Guru BK wajib diisi!', '⚠️');
        return;
      }

      showToast('Mendaftarkan Guru BK ke Google Sheets...', '⏳');
      try {
        const res = await callServer('addCounselorByAdmin', [{ email, name, title }]);
        showToast(res.message || `Guru BK ${name} berhasil didaftarkan!`, '✅');
        closeAdminCounselorModal();
        document.getElementById('admin-new-counselor-email').value = '';
        document.getElementById('admin-new-counselor-name').value = '';
        document.getElementById('admin-new-counselor-title').value = '';
        if (currentRole === 'COUNSELOR') loadCounselorDashboard();
      } catch (err) {
        showToast(err.message, '❌');
      }
    }

    async function handleStudentOnboarding() {
      const email = document.getElementById('onboarding-student-email').value.trim();
      const name = document.getElementById('onboarding-student-name').value.trim();
      const studentClass = document.getElementById('onboarding-student-class').value.trim();

      if (!studentClass) {
        showToast('Kelas wajib diisi untuk siswa baru!', '⚠️');
        return;
      }

      showToast('Menyimpan data kelas siswa...', '⏳');
      try {
        const res = await callServer('registerStudent', [{ email, name, class: studentClass }]);
        currentUser = (res && res.user) ? res.user : { email, name, role: 'STUDENT', class: studentClass, status: 'ACTIVE' };
        localStorage.setItem('wellbeing_user_session', JSON.stringify(currentUser));
        document.getElementById('student-onboarding-modal').classList.add('hidden');
        routeUserByRole();
        showToast(`Selamat datang ${currentUser.name}! Anda terdaftar di kelas ${currentUser.class}`, '🎉');
      } catch (err) {
        showToast(err.message, '❌');
      }
    }

    // Role-based routing: mengarahkan tampilan otomatis sesuai peran akun di spreadsheet
    function routeUserByRole() {
      if (!currentUser) {
        document.getElementById('auth-required-modal').classList.remove('hidden');
        setLanguage(currentLang);
        initIcons();
        return;
      }

      const viewStudent = document.getElementById('view-student');
      const viewCounselor = document.getElementById('view-counselor');
      const bottomNav = document.getElementById('student-bottom-nav');

      if (currentUser.role === 'COUNSELOR' || currentUser.role === 'ADMIN') {
        currentRole = 'COUNSELOR';
        viewStudent.classList.add('hidden');
        bottomNav.classList.add('hidden');
        viewCounselor.classList.remove('hidden');
        loadCounselorDashboard();
      } else {
        currentRole = 'STUDENT';
        viewCounselor.classList.add('hidden');
        viewStudent.classList.remove('hidden');
        bottomNav.classList.remove('hidden');
        loadJournals();
        loadStudentAppointments();
        loadCounselorList();
        loadActiveQuote();
        loadEducationalArticles();
        loadStudentMoodTrend();
        loadActiveSurvey();
      }

      updateUserUI();
      setLanguage(currentLang);
      initIcons();
    }

    function updateUserUI() {
      if (!currentUser) return;
      document.getElementById('app-user-name').innerText = currentUser.name || currentUser.email;

      const roleBadge = document.getElementById('app-user-role-badge');
      const avatar = document.getElementById('user-avatar-badge');
      const btnAdminAdd = document.getElementById('btn-admin-add-counselor');
      const btnAdminDash = document.getElementById('btn-admin-add-counselor-dash');

      if (currentUser.role === 'ADMIN') {
        if (roleBadge) roleBadge.innerText = t('role.admin', { class: currentUser.class || 'IT & Kesiswaan' });
        if (avatar) {
          avatar.innerText = 'ADM';
          avatar.className = 'w-8 h-8 rounded-xl bg-indigo-100 text-indigo-800 font-extrabold flex items-center justify-center text-xs border border-indigo-300';
        }
        if (btnAdminAdd) btnAdminAdd.classList.remove('hidden');
        if (btnAdminDash) btnAdminDash.classList.remove('hidden');
      } else if (currentUser.role === 'COUNSELOR') {
        if (roleBadge) roleBadge.innerText = t('role.counselor', { class: currentUser.class || 'Konselor' });
        if (avatar) {
          avatar.innerText = 'BK';
          avatar.className = 'w-8 h-8 rounded-xl bg-amber-100 text-amber-800 font-extrabold flex items-center justify-center text-xs border border-amber-300';
        }
        if (btnAdminAdd) btnAdminAdd.classList.add('hidden');
        if (btnAdminDash) btnAdminDash.classList.add('hidden');
      } else {
        if (roleBadge) roleBadge.innerText = t('role.student', { class: currentUser.class || 'SMP/SMA' });
        if (avatar) {
          avatar.innerText = currentUser.name ? currentUser.name.substring(0, 2).toUpperCase() : 'SW';
          avatar.className = 'w-8 h-8 rounded-xl bg-teal-50 text-teal-700 font-extrabold flex items-center justify-center text-xs border border-teal-200';
        }
        if (btnAdminAdd) btnAdminAdd.classList.add('hidden');
        if (btnAdminDash) btnAdminDash.classList.add('hidden');
      }
    }

    // Ambil daftar konselor aktif dari Google Sheets secara dinamis
    async function loadCounselorList() {
      try {
        const ctx = await callServer('getInitialContext', []);
        const counselors = (ctx && ctx.counselors) || [];
        
        const select = document.getElementById('apt-counselor');
        if (select) {
          if (counselors.length > 0) {

    // Helper: Resolve mood level to emoticon, score, and localized label
    function getMoodMeta(moodLevel) {
      if (!moodLevel) {
        return { emoji: '✨', label: 'Mood', rawLabel: 'Mood', score: 3, coreKey: null, secKey: null };
      }

      const lang = (typeof currentLang !== 'undefined' && currentLang === 'en') ? 'en' : 'id';
      const str = String(moodLevel).trim();

      // Check "Core - Secondary" format
      const parts = str.split(' - ');
      const rawCore = parts[0].trim();
      const rawSec = parts[1] ? parts[1].trim() : null;

      const coreEntry = Object.entries(FEELINGS_WHEEL_DATA).find(([k, v]) => 
        k.toLowerCase() === rawCore.toLowerCase() || 
        (v.name && ((v.name.id && v.name.id.toLowerCase() === rawCore.toLowerCase()) || 
                    (v.name.en && v.name.en.toLowerCase() === rawCore.toLowerCase())))
      );

      if (coreEntry) {
        const [coreKey, coreData] = coreEntry;
        const coreName = coreData.name[lang] || coreData.name.en || coreKey;
        if (rawSec) {
          const secData = coreData.secondary.find(s => 
            s.key.toLowerCase() === rawSec.toLowerCase() ||
            (s.name && ((s.name.id && s.name.id.toLowerCase() === rawSec.toLowerCase()) ||
                        (s.name.en && s.name.en.toLowerCase() === rawSec.toLowerCase())))
          );
          if (secData) {
            const secName = secData.name[lang] || secData.name.en || secData.key;
            return {
              emoji: secData.emoji || coreData.emoji,
              label: `${coreName} - ${secName}`,
              rawLabel: `${coreKey} - ${secData.key}`,
              score: coreData.score,
              coreKey: coreKey,
              secKey: secData.key
            };
          }
          return {
            emoji: coreData.emoji,
            label: `${coreName} - ${rawSec}`,
            rawLabel: str,
            score: coreData.score,
            coreKey: coreKey,
            secKey: rawSec
          };
        }
        return {
          emoji: coreData.emoji,
          label: coreName,
          rawLabel: coreKey,
          score: coreData.score,
          coreKey: coreKey,
          secKey: null
        };
      }

      // Legacy Mood Mapping
      const legacyMap = {
        'Hebat': { emoji: '🤩', score: 5, label: 'Hebat' },
        'Baik': { emoji: '😊', score: 4, label: 'Baik' },
        'B aja': { emoji: '😐', score: 3, label: 'B aja' },
        'Netral': { emoji: '😐', score: 3, label: 'Netral' },
        'Lelah': { emoji: '😔', score: 2, label: 'Lelah' },
        'Stres': { emoji: '😫', score: 1, label: 'Stres' }
      };

      if (legacyMap[str]) {
        return {
          emoji: legacyMap[str].emoji,
          label: legacyMap[str].label,
          rawLabel: str,
          score: legacyMap[str].score,
          coreKey: null,
          secKey: null
        };
      }

      // Fallback prefix search
      const lower = str.toLowerCase();
      if (lower.startsWith('happy') || lower.startsWith('hebat') || lower.startsWith('senang')) {
        return { emoji: '😄', label: str, rawLabel: str, score: 5, coreKey: 'Happy', secKey: null };
      }
      if (lower.startsWith('surprise') || lower.startsWith('terkejut') || lower.startsWith('kaget') || lower.startsWith('baik')) {
        return { emoji: '😲', label: str, rawLabel: str, score: 4, coreKey: 'Surprise', secKey: null };
      }
      if (lower.startsWith('sad') || lower.startsWith('sedih') || lower.startsWith('lelah')) {
        return { emoji: '😢', label: str, rawLabel: str, score: 2, coreKey: 'Sad', secKey: null };
      }
      if (lower.startsWith('disgust') || lower.startsWith('muak')) {
        return { emoji: '🤢', label: str, rawLabel: str, score: 2, coreKey: 'Disgust', secKey: null };
      }
      if (lower.startsWith('anger') || lower.startsWith('marah') || lower.startsWith('stres')) {
        return { emoji: '😠', label: str, rawLabel: str, score: 1, coreKey: 'Anger', secKey: null };
      }
      if (lower.startsWith('fear') || lower.startsWith('takut') || lower.startsWith('cemas')) {
        return { emoji: '😨', label: str, rawLabel: str, score: 1, coreKey: 'Fear', secKey: null };
      }

      return { emoji: '✨', label: str, rawLabel: str, score: 3, coreKey: null, secKey: null };
    }

    function openMoodDetail(moodId) {
      const mood = (cachedMoods || []).find(m => String(m.id) === String(moodId));
      if (!mood) return;

      const meta = getMoodMeta(mood.mood_level);
      const d = mood.timestamp ? new Date(mood.timestamp) : null;
      const dateFormatted = (d && !isNaN(d.getTime()))
        ? d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })
        : 'Waktu tidak diketahui';

      const modalEmoji = document.getElementById('modal-mood-emoji');
      const modalTitle = document.getElementById('modal-mood-title');
      const modalDate = document.getElementById('modal-mood-date');
      const modalScore = document.getElementById('modal-mood-score');

      if (modalEmoji) modalEmoji.innerText = meta.emoji;
      if (modalTitle) modalTitle.innerText = meta.label || mood.mood_level || 'Mood';
      if (modalDate) modalDate.innerText = dateFormatted;
      if (modalScore) modalScore.innerText = `Skor: ${mood.mood_score || meta.score || 3} / 5`;

      const triggersContainer = document.getElementById('modal-mood-triggers');
      if (triggersContainer) {
        if (mood.triggers) {
          const trigList = Array.isArray(mood.triggers) ? mood.triggers : String(mood.triggers).split(',');
          triggersContainer.innerHTML = trigList.map(t => 
            `<span class="text-xs bg-teal-50 text-teal-800 border border-teal-200 font-semibold px-2.5 py-1 rounded-xl">${escapeHtml(t.trim())}</span>`
          ).join('');
        } else {
          triggersContainer.innerHTML = `<span class="text-xs text-slate-400 italic">Tidak ada faktor pemicu khusus</span>`;
        }
      }

      const notesEl = document.getElementById('modal-mood-notes');
      if (notesEl) {
        notesEl.innerText = mood.notes && mood.notes.trim() ? mood.notes : 'Tidak ada catatan tambahan.';
      }

      const modal = document.getElementById('modal-mood-detail');
      if (modal) modal.classList.remove('hidden');
      if (typeof initIcons === 'function') initIcons();
    }

    function closeMoodDetailModal() {

    // Global modal accessibility: Escape key & backdrop click dismissal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.fixed.inset-0:not(.hidden)').forEach(modal => {
          // Do not dismiss mandatory onboarding or auth modals with Escape
          if (modal.id === 'auth-required-modal' || modal.id === 'student-onboarding-modal') return;
          modal.classList.add('hidden');
        });
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fixed.inset-0').forEach(modal => {
        if (modal.id === 'auth-required-modal' || modal.id === 'student-onboarding-modal') return;
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            modal.classList.add('hidden');
          }
        });
      });
    });

    // =========================================================================
    // AUTO-RUN SAAT HALAMAN DIMUAT (SESSION & ONBOARDING ROUTER)
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      setLanguage(currentLang);
      initIcons();
      initDraftRecovery();

      // 1. Dapatkan email Google aktif dari konteks server (Google Apps Script SSO)
      let activeEmail = (SERVER_CONTEXT && SERVER_CONTEXT.activeEmail) ? SERVER_CONTEXT.activeEmail.trim() : '';

      // Jika tidak ada email akun Google yang aktif, tampilkan layar login resmi Google (ALCOA compliant)
      if (!activeEmail) {
        document.getElementById('auth-required-modal').classList.remove('hidden');
        setLanguage(currentLang);
        initIcons();
        return;
      }

      // 2. Jika data pengguna sudah terdeteksi dari serverContext
      if (SERVER_CONTEXT && SERVER_CONTEXT.detectedUser) {
        currentUser = SERVER_CONTEXT.detectedUser;
        if (currentUser.needsClassOnboarding) {
          document.getElementById('onboarding-student-email').value = currentUser.email;
          document.getElementById('onboarding-student-name').value = currentUser.name || currentUser.email.split('@')[0];
          document.getElementById('onboarding-student-class').value = '';
          document.getElementById('student-onboarding-modal').classList.remove('hidden');
          setLanguage(currentLang);
        initIcons();
          return;
        }
        localStorage.setItem('wellbeing_user_session', JSON.stringify(currentUser));
        routeUserByRole();
        return;
      }

      // 3. Verifikasi akun aktif ke database Google Sheets
      try {
        const sessionInfo = await callServer('checkUserSession', [activeEmail]);
        if (sessionInfo && sessionInfo.needsClassOnboarding) {
          document.getElementById('onboarding-student-email').value = activeEmail;
          document.getElementById('onboarding-student-name').value = sessionInfo.name || activeEmail.split('@')[0];
          document.getElementById('onboarding-student-class').value = '';
          document.getElementById('student-onboarding-modal').classList.remove('hidden');
          setLanguage(currentLang);
        initIcons();
          return;
        }

        currentUser = sessionInfo;
        localStorage.setItem('wellbeing_user_session', JSON.stringify(currentUser));
        routeUserByRole();
      } catch (err) {
        console.error('Session sync error:', err);
        showToast('Gagal memverifikasi akun Google: ' + err.message, '❌');
      }
    });
